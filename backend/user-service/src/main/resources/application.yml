server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: user-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:9a4f2c8d7e1b5a3f8c6d4e2b0a1f9e8d7c5b3a1f4e2d0c9b8a7f6e5d4c3b2a1f}
  expiration-ms: 86400000 # 24 Hours in milliseconds

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
